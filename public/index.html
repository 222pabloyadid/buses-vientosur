<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Buses VientoSur | Inicio</title>

<style>
:root {
  --azul: #102d58;
  --verde: #079b91;
  --fondo: #f3f7fa;
  --texto: #193451;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--fondo);
  color: var(--texto);
}

.app {
  width: 100%;
  max-width: 550px;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #fff;
  overflow: hidden;
}

.cabecera {
  flex-shrink: 0;
  padding: max(10px, env(safe-area-inset-top)) 18px 8px;
  text-align: center;
  background: white;
}

.logo {
  display: block;
  width: min(190px, 58vw);
  height: clamp(65px, 13dvh, 112px);
  object-fit: contain;
  margin: auto;
}

.saludo {
  margin: 6px 0 0;
  font-size: 12px;
  color: #71839a;
  font-weight: 600;
  letter-spacing: 1.3px;
}

.contenido {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 20px;
  gap: 15px;
}

.bienvenida {
  background: linear-gradient(135deg, #102d58, #16537a);
  border-radius: 20px;
  padding: clamp(14px, 3dvh, 25px);
  color: white;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.bienvenida:after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border: 25px solid rgba(255,255,255,.05);
  border-radius: 50%;
  right: -60px;
  top: -60px;
}

.etiqueta {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.4px;
  color: #91e5dc;
}

h1 {
  margin: 8px 0;
  font-size: clamp(21px, 5.5vw, 29px);
  line-height: 1.15;
}

.bienvenida p {
  margin: 0;
  color: #d8e7f4;
  font-size: 13px;
}

.seccion {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 12px;
}

.seccion h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
  flex-shrink: 0;
}

.opciones {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
}

.opcion {
  min-height: 0;
  background: #fff;
  border: 1px solid #e3eaf1;
  border-radius: 18px;
  padding: 14px 9px;
  text-align: center;
  text-decoration: none;
  color: var(--azul);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 5px 15px rgba(16,45,88,.055);
  font: inherit;
}

a.opcion:active {
  transform: scale(.97);
  background: #eef9f8;
}

.icono {
  width: clamp(37px, 7dvh, 52px);
  height: clamp(37px, 7dvh, 52px);
  background: #e7f7f5;
  color: #008f86;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icono svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.opcion strong {
  font-size: clamp(12px, 3.5vw, 15px);
}

.opcion small {
  color: #71839a;
  font-size: 11px;
}

.opcion:disabled {
  opacity: .60;
  cursor: default;
}

.aviso {
  text-align: center;
  font-size: 11px;
  color: #78889a;
  margin: 0;
  flex-shrink: 0;
}

.navegacion {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid #e7edf3;
  background: white;
  padding: 10px 5px max(10px, env(safe-area-inset-bottom));
}

.nav-item {
  color: #7c8999;
  background: transparent;
  text-decoration: none;
  border: none;
  font: inherit;
  font-size: 11px;
  text-align: center;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 5px;
}

.nav-item svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item.activo {
  color: var(--verde);
  font-weight: bold;
}

.nav-item:disabled {
  opacity: .55;
}

@media(max-height: 680px) {
  .contenido { gap: 9px; padding-top: 6px; padding-bottom: 6px; }
  .bienvenida { padding: 12px 16px; }
  .opciones { gap: 8px; }
  .opcion { gap: 3px; padding: 6px; }
  .aviso { display: none; }
}

@media(max-height: 540px) {
  .logo { height: 48px; }
  .saludo { display: none; }
  .bienvenida p { display: none; }
  .bienvenida h1 { margin-bottom: 0; }
  .icono { width: 30px; height: 30px; }
  .icono svg { width: 19px; height: 19px; }
  .opcion small { display: none; }
}

/* COLORES VIENTOSUR - PORTADA */
body {
  background: #dcecf5;
}

.app {
  background: #eaf4f9;
}

.cabecera {
  background: #ffffff;
  border-bottom: 3px solid #08a99b;
}

.saludo {
  color: #123763;
  font-weight: 800;
}

.contenido {
  background: linear-gradient(180deg, #eaf4f9, #d9ebf5);
}

.bienvenida {
  background: linear-gradient(135deg, #082b57, #086f91);
  box-shadow: 0 8px 22px rgba(6,48,91,.18);
}

.seccion h2 {
  color: #092e5d;
}

.opcion {
  background: #ffffff;
  border: 2px solid #b7dbe7;
  box-shadow: 0 6px 16px rgba(8,54,95,.12);
}

.opcion:nth-child(1) {
  background: #0e4d8b;
  border-color: #0e4d8b;
  color: white;
}

.opcion:nth-child(2) {
  background: #008f91;
  border-color: #008f91;
  color: white;
}

.opcion:nth-child(1) small,
.opcion:nth-child(2) small {
  color: #e5f6ff;
}

.opcion:nth-child(1) .icono,
.opcion:nth-child(2) .icono {
  background: rgba(255,255,255,.18);
  color: white;
}

.opcion:nth-child(3),
.opcion:nth-child(4) {
  background: #e6f1f7;
  border-color: #bed5e4;
  color: #315574;
}

.opcion:disabled {
  opacity: 1;
}

.opcion:disabled .icono {
  background: #d0e9e9;
  color: #087f86;
}

.opcion:disabled small {
  color: #5e788f;
}

.aviso {
  color: #315574;
  font-weight: 600;
}

.navegacion {
  background: #102d58;
  border-top: 2px solid #07a89b;
}

.nav-item {
  color: #d4e3f0;
}

.nav-item.activo {
  color: #65e1d2;
}

.nav-item:disabled {
  opacity: .7;
}
</style>
</head>

<body>
<div class="app">

<header class="cabecera">
  <img src="/logo.png" class="logo" alt="Buses VientoSur">
  <p class="saludo">TU VIAJE COMIENZA AQUÍ</p>
</header>

<main class="contenido">

<section class="bienvenida">
  <span class="etiqueta">BIENVENIDO A BORDO</span>
  <h1>¿A dónde viajamos hoy?</h1>
  <p>Tu próximo destino está más cerca.</p>
</section>

<section class="seccion">
  <h2>¿Qué deseas hacer?</h2>

  <div class="opciones">

    <a href="/compra.html" class="opcion">
      <span class="icono">
        <svg viewBox="0 0 24 24">
          <path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4z"/>
          <path d="M12 5v14" stroke-dasharray="2 3"/>
        </svg>
      </span>
      <strong>Comprar pasaje</strong>
      <small>Reserva tu asiento</small>
    </a>

    <a href="/compra.html" class="opcion">
      <span class="icono">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l4 2"/>
        </svg>
      </span>
      <strong>Horarios</strong>
      <small>Consulta las salidas</small>
    </a>

    <button class="opcion" disabled>
      <span class="icono">
        <svg viewBox="0 0 24 24">
          <path d="M4 5h16v14H4z"/>
          <path d="M8 9h8M8 13h5"/>
        </svg>
      </span>
      <strong>Mis pasajes</strong>
      <small>Próximamente</small>
    </button>

    <button class="opcion" disabled>
      <span class="icono">
        <svg viewBox="0 0 24 24">
          <path d="M3 7h18v11H3z"/>
          <path d="M7 7V4h10v3M7 18v2M17 18v2"/>
          <circle cx="7" cy="14" r="1"/>
          <circle cx="17" cy="14" r="1"/>
        </svg>
      </span>
      <strong>Seguir mi bus</strong>
      <small>Próximamente</small>
    </button>

  </div>
</section>

<p class="aviso">Viaja cómodo · Viaja seguro · Viaja VientoSur</p>
</main>

<nav class="navegacion">
  <a href="/" class="nav-item activo">
    <svg viewBox="0 0 24 24">
      <path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3z"/>
    </svg>
    Inicio
  </a>

  <a href="/compra.html" class="nav-item">
    <svg viewBox="0 0 24 24">
      <path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4z"/>
    </svg>
    Pasajes
  </a>

  <button class="nav-item" disabled>
    <svg viewBox="0 0 24 24">
      <path d="M4 5h16v14H4zM8 9h8M8 13h5"/>
    </svg>
    Mis viajes
  </button>

  <button class="nav-item" disabled>
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-5 16-5 16 0"/>
    </svg>
    Mi cuenta
  </button>
</nav>

</div>
</body>
</html>
