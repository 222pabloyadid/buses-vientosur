<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asientos</title>


<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#d8ebff,#edf6ff);
  color: #102d53;
}

.container {
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 20px 12px;
}

.lado-izq {
  background: white;
  padding: 22px;
  border-radius: 22px;
  width: 100%;
  max-width: 680px;
  text-align: center;
  align-self: flex-start;
  box-shadow: 0 12px 35px #123c6820;
}

.marca {
  background: linear-gradient(120deg,#064487,#0875c6);
  color: white;
  padding: 20px;
  margin: -22px -22px 22px;
  border-radius: 22px 22px 0 0;
  font-size: 25px;
  font-weight: bold;
}

h2 {
  color: #073e7b;
  margin: 0 0 18px;
}

.detalles {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 9px;
  text-align: left;
  margin-bottom: 18px;
}

.etiqueta {
  padding: 12px;
  background: #f0f6ff;
  border: 1px solid #c8d9ef;
  border-radius: 12px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.etiqueta.ancha { grid-column: 1 / -1; }

.etiqueta strong {
  display: block;
  color: #0756a1;
  margin-bottom: 5px;
}

.leyenda {
  display: flex;
  justify-content: center;
  gap: 13px;
  flex-wrap: wrap;
  margin: 18px 0;
  font-size: 12px;
  font-weight: bold;
}

.punto {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 4px;
  margin-right: 4px;
  vertical-align: middle;
}

.libre { background: #26994b; }
.elegido { background: #e00000; }
.ocupado-color { background: #d64242; }

.bus-marco {
  max-width: 440px;
  margin: auto;
  padding: 16px 10px 25px;
  border: 4px solid #a9bfd6;
  border-radius: 55px 55px 32px 32px;
  background: linear-gradient(#f8fbff,#eaf3fc);
}

.volante {
  text-align: left;
  padding-left: 9%;
  margin-bottom: 20px;
}

.volante svg {
  width: 46px;
  height: 46px;
}

.bus {
  display: grid;
  grid-template-columns: repeat(5,minmax(0,1fr));
  gap: 17px 5px;
  width: 100%;
}

.asiento {
  position: relative;
  width: 100%;
  max-width: 65px;
  aspect-ratio: .83;
  justify-self: center;
  border: 2px solid #243e59;
  border-radius: 13px 13px 10px 10px;
  background: linear-gradient(#788fa6,#354e69);
  color: white;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 5px #ffffff30,0 4px #1d344a;
  margin: 4px 0;
}

.asiento::before,
.asiento::after {
  content: "";
  position: absolute;
  top: 32%;
  width: 8px;
  height: 34%;
  border: 1px solid #263c50;
  border-radius: 6px;
  background: inherit;
}

.asiento::before { left: -6px; }
.asiento::after { right: -6px; }

.asiento.ocupado {
  background: linear-gradient(#ef7777,#bd3030);
  cursor: not-allowed;
}

.asiento.seleccionado {
  background: linear-gradient(#ff4545,#c00000);
  border-color: #8b0000;
  color: white;
  box-shadow: 0 0 0 3px #ffb3b3, 0 4px #8b0000;
}

.asiento:disabled { opacity: 1; }

.asiento:focus-visible {
  outline: 3px solid #ffad25;
  outline-offset: 5px;
}

.info {
  margin-top: 22px;
  font-weight: bold;
  color: #0756a1;
}

#nota {
  width: 100%;
  padding: 13px;
  border: 1px solid #c5d5e9;
  border-radius: 11px;
  font-size: 15px;
}

.btn {
  margin-top: 15px;
  width: 100%;
  padding: 16px;
  background: linear-gradient(110deg,#0754a0,#002e69);
  border: none;
  color: white;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
  cursor: pointer;
}

@media(max-width:480px) {
  .lado-izq { padding: 17px; }
  .marca { margin: -17px -17px 20px; }
  h2 { font-size: 23px; }
  .etiqueta { font-size: 12px; padding: 9px; }
  .bus { column-gap: 4px; }
  .asiento { font-size: 14px; }
  .bus-marco { padding: 14px 8px 20px; }
}
</style>


  

</head>

<body>

<div class="container">

  <div class="lado-izq">

    <div class="marca">🚌 Buses VientoSur</div>
    <h2>Selecciona tu asiento</h2>
    <div class="detalles" id="viaje"></div>

    <div class="leyenda">
      <span><i class="punto libre"></i>Disponible</span>
      <span><i class="punto elegido"></i>Seleccionado</span>
      <span><i class="punto ocupado-color"></i>Ocupado</span>
    </div>

    <div class="bus-marco">
      <div class="volante" aria-label="Volante del conductor">
        <svg viewBox="0 0 48 48" fill="none"
             stroke="#243e59" stroke-width="4">
          <circle cx="24" cy="24" r="19"/>
          <circle cx="24" cy="24" r="5"/>
          <path d="M5 20 Q24 13 43 20"/>
          <path d="M21 29 L17 42 M27 29 L31 42"/>
        </svg>
      </div>
      <div class="bus" id="bus"></div>
    </div>

    <div class="info">
      <p id="infoAsiento">Selecciona un asiento</p>
    </div>
    
    <p style="margin-top:10px; font-weight:bold;">
      Observaciones (opcional)
    </p>

    <input 
      type="text" 
      id="nota" 
      placeholder="Ej: equipaje, referencia, etc"
      style="width:100%; padding:10px;"
    > 

    <button class="btn" onclick="pagar()">PAGAR</button>

  </div>

  <div class="lado-der"></div>

</div>

<script>

// 🔹 obtener parámetros de la URL

const params = new URLSearchParams(window.location.search);
let origen = params.get("origen");
let destino = params.get("destino");

// guardar si vienen
if (origen) localStorage.setItem("origen", origen);
if (destino) localStorage.setItem("destino", destino);

// recuperar si vienen null
if (!origen) origen = localStorage.getItem("origen");
if (!destino) destino = localStorage.getItem("destino");


const nombre = params.get("nombre");
const correo = params.get("correo");
const fecha = params.get("fecha");
const hora = params.get("hora");
const precio = params.get("precio");






function escaparHTML(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

document.getElementById("viaje").innerHTML = `
  <div class="etiqueta ancha">
    <strong>📍 Ruta</strong>
    ${escaparHTML(origen)} → ${escaparHTML(destino)}
  </div>
  <div class="etiqueta">
    <strong>👤 Pasajero</strong>${escaparHTML(nombre)}
  </div>
  <div class="etiqueta">
    <strong>📅 Fecha</strong>${escaparHTML(fecha)}
  </div>
  <div class="etiqueta">
    <strong>🕒 Hora</strong>${escaparHTML(hora)}
  </div>
  <div class="etiqueta">
    <strong>✉️ Correo</strong>${escaparHTML(correo)}
  </div>
`;

// 🔹 asientos ocupados (ejemplo)


let asientoSeleccionado = null;

const bus = document.getElementById("bus");

fetch(`/asientos?fecha=${fecha}&hora=${hora}`)
.then(res => res.json())
.then(data => {

    const bus = document.getElementById("bus");
    bus.innerHTML = "";


    data.forEach((a) => {
        const numero = Number(a.numero);

        if (!Number.isInteger(numero) ||
            numero < 1 || numero > 29) return;

        const fila = numero <= 24
            ? Math.ceil(numero / 4)
            : 7;

        const columna = numero <= 24
            ? [1,2,4,5][(numero - 1) % 4]
            : numero - 24;

        const asiento = document.createElement("button");
        asiento.type = "button";
        asiento.classList.add("asiento");
        asiento.textContent = numero;
        asiento.style.gridRow = fila;
        asiento.style.gridColumn = columna;
        asiento.setAttribute("aria-label", "Asiento " + numero);

        if (a.ocupado) {
            asiento.classList.add("ocupado");
            asiento.disabled = true;
            asiento.setAttribute(
                "aria-label", "Asiento " + numero + " ocupado"
            );
        } else {
            asiento.onclick = () => {
                document.querySelectorAll(".asiento").forEach(el =>
                    el.classList.remove("seleccionado")
                );

                asiento.classList.add("seleccionado");
                asientoSeleccionado = numero;

                document.getElementById("infoAsiento").innerText =
                    "Asiento " + numero;
            };
        }

        bus.appendChild(asiento);
    });

});


async function pagar() {
  if (!asientoSeleccionado) {
    alert("Selecciona un asiento");
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const nombre = params.get("nombre");
  const correo = params.get("correo");
  let origen = params.get("origen");
  let destino = params.get("destino");

  // 🔥 si vienen null, los recuperamos
  if (!origen) origen = localStorage.getItem("origen");
  if (!destino) destino = localStorage.getItem("destino");

  // 🔥 los guardamos para el resto del flujo
  localStorage.setItem("origen", origen);
  localStorage.setItem("destino", destino);


const fecha = params.get("fecha");
const hora = params.get("hora");

await fetch("/reservar", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    asiento: asientoSeleccionado,
    fecha: fecha,
    hora: hora
  })
});

  await fetch("/pagar", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      nombre: nombre,
      correo: correo,
      origen: origen,
      destino: destino,
      precio: precio,
      fecha: fecha,
      hora: hora,
      asiento: asientoSeleccionado
    })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.init_point || !/^https:\/\//.test(data.init_point)) {
      console.error("Respuesta de pago:", data);
      alert("No se pudo iniciar el pago. Intenta nuevamente.");
      return;
    }

    window.location.href = data.init_point;
  });
}  

</script>

</body>
</html>
