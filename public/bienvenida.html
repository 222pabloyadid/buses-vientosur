<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d58">
<title>Bienvenido | Buses VientoSur</title>




<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;
  background: #07376b;
}

.pantalla {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #07376b;
}

.pantalla::before {
  content: "";
  position: absolute;
  inset: -25px;
  background: url("/portada-vientosur.png") center / cover no-repeat;
  filter: blur(22px) brightness(.65);
  transform: scale(1.08);
  pointer-events: none;
}

.portada {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

.botones {
  position: absolute;
  inset: 0;
}

.boton {
  position: absolute;
  display: block;
  border-radius: 999px;
  text-decoration: none;
  font-size: 0;
  color: transparent;
}

.estado {
  position: absolute;
  bottom: 0;
  font-size: 0;
  color: transparent;
}

[hidden] { display: none !important; }
</style>




</head>
<body>


<main class="pantalla">
  <img class="portada" id="imagenPortada"
       src="/portada-vientosur.png"
       alt="Buses VientoSur">

  <div class="botones" id="botones" hidden>
    <a class="boton registro" href="/registro.html"
       aria-label="Crear mi cuenta">Crear mi cuenta</a>
    <a class="boton login" href="/login.html"
       aria-label="Iniciar sesión">Iniciar sesión</a>
  </div>

  <p class="estado" id="estado">Verificando acceso...</p>
</main>



<script>
(async function() {
  const token = localStorage.getItem("vientosur_token");
  const estado = document.getElementById("estado");
  const botones = document.getElementById("botones");

  if (token) {
    try {
      const respuesta = await fetch("/api/auth/yo", {
        headers: {
          Authorization: "Bearer " + token
        },
        cache: "no-store"
      });

      if (respuesta.ok) {
        const datos = await respuesta.json();

        if (datos.ok) {
          location.replace("/");
          return;
        }
      }

      if (respuesta.status === 401) {
        localStorage.removeItem("vientosur_token");
      }
    } catch (error) {
      estado.textContent = "No se pudo verificar la conexión.";
    }
  }

  botones.hidden = false;

  if (estado.textContent === "Verificando acceso...") {
    estado.textContent = "Ingresa para comenzar tu viaje.";
  }
})();
</script>

<script>
(function () {
  const imagen = document.getElementById("imagenPortada");
  const registro = document.querySelector(".registro");
  const login = document.querySelector(".login");

  function ajustar() {
    if (!imagen.naturalWidth || !imagen.naturalHeight) return;

    const w = innerWidth;
    const h = innerHeight;
    const escala = Math.min(
      w / imagen.naturalWidth,
      h / imagen.naturalHeight
    );

    const ancho = imagen.naturalWidth * escala;
    const alto = imagen.naturalHeight * escala;
    const x = (w - ancho) / 2;
    const y = (h - alto) / 2;

    function colocar(elemento, izquierda, arriba, anchoBoton, altoBoton) {
      elemento.style.left = (x + ancho * izquierda) + "px";
      elemento.style.top = (y + alto * arriba) + "px";
      elemento.style.width = (ancho * anchoBoton) + "px";
      elemento.style.height = (alto * altoBoton) + "px";
    }

    colocar(registro, .083, .636, .834, .088);
    colocar(login, .083, .736, .834, .088);
  }

  imagen.addEventListener("load", ajustar);
  window.addEventListener("resize", ajustar);
  ajustar();
})();
</script>

</body>
</html>
