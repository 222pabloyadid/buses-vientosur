<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d58">
<title>Bienvenido | Buses VientoSur</title>

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  background: #06366a;
  font-family: Arial, sans-serif;
}
.pantalla {
  position: relative;
  width: min(100vw, 77.14dvh);
  height: min(100dvh, 129.63vw);
  margin: auto;
  background: url("/portada-vientosur.png") center / 100% 100% no-repeat;
}
.botones {
  position: absolute;
  inset: 0;
}
.boton {
  position: absolute;
  left: 8%;
  width: 84%;
  height: 8.7%;
  display: block;
  text-decoration: none;
  font-size: 0;
  color: transparent;
  border-radius: 999px;
}
.registro { top: 65.4%; }
.login { top: 75.5%; }
.estado {
  position: absolute;
  bottom: 1%;
  width: 100%;
  text-align: center;
  color: transparent;
  font-size: 0;
}
[hidden] { display: none !important; }
</style>

</head>
<body>

<main class="pantalla">
  <div class="botones" id="botones" hidden>
    <a class="boton registro" href="/registro.html" aria-label="Crear mi cuenta">Crear mi cuenta</a>
    <a class="boton login" href="/login.html" aria-label="Iniciar sesión">Iniciar sesión</a>
  </div>
  <p class="estado" id="estado">Verificando acceso...</p>
</main>


<script>
(async function() {
  const token = localStorage.getItem("vientosur_token");
  const estado = document.getElementById("estado");
  const botones = document.getElementById("botones");

  if (token) {
    try {
      const respuesta = await fetch("/api/auth/yo", {
        headers: {
          Authorization: "Bearer " + token
        },
        cache: "no-store"
      });

      if (respuesta.ok) {
        const datos = await respuesta.json();

        if (datos.ok) {
          location.replace("/");
          return;
        }
      }

      if (respuesta.status === 401) {
        localStorage.removeItem("vientosur_token");
      }
    } catch (error) {
      estado.textContent = "No se pudo verificar la conexión.";
    }
  }

  botones.hidden = false;

  if (estado.textContent === "Verificando acceso...") {
    estado.textContent = "Ingresa para comenzar tu viaje.";
  }
})();
</script>
</body>
</html>
