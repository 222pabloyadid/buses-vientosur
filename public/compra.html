<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buses VientoSur | Pasajes</title>
<link rel="stylesheet" href="/styles.css">





<style>
.fecha-contenedor {
  position: relative;
  width: 100%;
}

.fecha-contenedor input[type="date"] {
  display: block;
  width: 100%;
  min-height: 62px;
  padding: 12px 55px 12px 15px;
  font-size: 18px;
  box-sizing: border-box;
  cursor: pointer;
  -webkit-appearance: auto;
  appearance: auto;
}

.fecha-contenedor input[type="date"]::-webkit-calendar-picker-indicator {
  opacity: 1;
  cursor: pointer;
}

.horarios-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 10px;
  margin: 15px 0;
}

.horario-opcion {
  padding: 14px 5px;
  border: 2px solid #c7d8eb;
  border-radius: 12px;
  background: white;
  color: #12365d;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.horario-opcion.activo {
  background: #0758b5;
  border-color: #003d83;
  color: white;
}
</style>

<style>
.fecha-contenedor {
  display: flex;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

.fecha-contenedor #fecha {
  flex: 1;
  width: 0;
  min-width: 0;
  height: 58px;
  box-sizing: border-box;
  font-size: 17px;
  cursor: pointer;
}

.fecha-contenedor #abrir-calendario {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 60px;
  width: 60px;
  min-height: 58px;
  padding: 0;
  background: #e8f2ff;
  border: 1px solid #b8cce6;
  border-radius: 12px;
  font-size: 27px;
  color: #12365d;
}

.calendario-panel[hidden] {
  display: none !important;
}

.calendario-panel {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 8px;
  border: 1px solid #c7d8eb;
  border-radius: 14px;
  background: white;
  box-shadow: 0 8px 25px #123c6820;
}

.calendario-cabecera {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.calendario-cabecera button {
  width: 42px;
  min-height: 42px;
  padding: 0;
  background: #0758b5;
  color: white;
  font-size: 26px;
}

.calendario-dias {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  gap: 4px;
  text-align: center;
}

.calendario-dias span {
  padding: 8px 0;
  font-size: 12px;
  font-weight: bold;
}

.calendario-dias button {
  width: 100%;
  min-height: 39px;
  padding: 4px 0;
  border-radius: 8px;
  background: #edf4ff;
  color: #12365d;
  font-size: 14px;
}

.calendario-dias button:disabled {
  opacity: .3;
  cursor: not-allowed;
}

.calendario-dias button.elegida {
  background: #0758b5;
  color: white;
}
</style>
</head>
<body>

<header class="cabecera">
<img src="/logo.png" class="logo" alt="Buses VientoSur">
<p>Tu viaje comienza aquí</p>
</header>

<main class="contenedor">
<section class="tarjeta">

<div class="encabezado">
<span>VIAJA CON NOSOTROS</span>
<h1>Compra tu pasaje</h1>
<p>Consulta horarios, tarifas y elige tu asiento</p>
</div>

<div class="formulario">

<label for="nombre">Nombre del pasajero</label>
<input id="nombre" type="text" placeholder="Ingresa tu nombre" autocomplete="name">

<label for="correo">Correo electrónico</label>
<input id="correo" type="email" placeholder="tu@email.com" autocomplete="email">
<div id="bloque-confirmar-correo">
<label for="confirmar-correo">Confirmar correo electrónico</label>
<input id="confirmar-correo" type="email"
placeholder="Repite tu correo" autocomplete="off">
</div>


<div class="rutas">
<div>
<label for="origen">Origen</label>
<select id="origen" onchange="actualizarDestinos()">
<option>Tolten</option>
<option>Hualpin</option>
<option>TeodoroSchmidt</option>
<option>BarrosArana</option>
<option>Temuco</option>
</select>
</div>

<div>
<label for="destino">Destino</label>
<select id="destino">
<option>Temuco</option>
<option>Freire</option>
<option>Pitrufquen</option>
</select>
</div>
</div>

<label for="fecha">Fecha de viaje</label>
<div class="fecha-contenedor">
  <input id="fecha" name="fecha" type="date"
    aria-label="Fecha del viaje" readonly>
  <button type="button" id="abrir-calendario"
    aria-label="Abrir calendario">📅</button>
</div>
<div id="calendario-panel" class="calendario-panel" hidden>
  <div class="calendario-cabecera">
    <button type="button" id="mes-anterior" aria-label="Mes anterior">‹</button>
    <strong id="calendario-mes"></strong>
    <button type="button" id="mes-siguiente" aria-label="Mes siguiente">›</button>
  </div>
  <div class="calendario-dias">
    <span>Lu</span><span>Ma</span><span>Mi</span>
    <span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
  </div>
  <div id="calendario-fechas" class="calendario-dias"></div>
</div>
<p style="font-size:13px;color:#526781;margin:5px 0 12px">
La fecha de hoy aparece automáticamente. Puedes cambiarla.
</p>

<button class="buscar" onclick="buscar()">
Actualizar horarios
</button>

<div id="resultado" class="resultado" aria-live="polite"></div>

<button class="continuar" onclick="irAAsientos()">
Continuar a los asientos →
</button>

</div>
</section>

<p class="frase">Viaja cómodo · Viaja seguro · Viaja VientoSur</p>
</main>

<footer>
© 2026 Buses VientoSur · Creado por Pablo Yañez
</footer>

<script>
function actualizarDestinos() {
  const origen = document.getElementById("origen").value;
  const destinoSelect = document.getElementById("destino");

  destinoSelect.innerHTML = "";

  if (origen === "Temuco") {
    destinoSelect.innerHTML += "<option>Lolen</option>";
    destinoSelect.innerHTML += "<option>Arauco</option>";
    destinoSelect.innerHTML += "<option>Parada21</option>";
    destinoSelect.innerHTML += "<option>LasDichas</option>";
    destinoSelect.innerHTML += "<option>Limite</option>";
    destinoSelect.innerHTML += "<option>BarrosArana</option>";
    destinoSelect.innerHTML += "<option>Parada31</option>";
    destinoSelect.innerHTML += "<option>TeodoroSchmidt</option>";
    destinoSelect.innerHTML += "<option>Hualpin</option>";
    destinoSelect.innerHTML += "<option>Tolten</option>";
  } else {
    destinoSelect.innerHTML += "<option>Temuco</option>";
    destinoSelect.innerHTML += "<option>Freire</option>";
    destinoSelect.innerHTML += "<option>Pitrufquen</option>";
  }
}
let consultaHorarios = 0;

function fechaActualChile() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Santiago",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

async function buscar() {
  const consulta = ++consultaHorarios;
  window.horarioSeleccionado = "";
  window.precioSeleccionado = null;

  const contenedor = document.getElementById("resultado");
  const origen = document.getElementById("origen").value;
  const destino = document.getElementById("destino").value;
  const fecha = document.getElementById("fecha").value;
  const hoy = fechaActualChile();

  if (!fecha || fecha < hoy) {
    contenedor.textContent =
      "Selecciona una fecha válida desde hoy.";
    return;
  }

  let dia = "semana";
  const [year, month, day] = fecha.split("-").map(Number);
  const fechaObj = new Date(year, month - 1, day);
  const diaSemana = fechaObj.getDay();

  if (diaSemana === 6) dia = "sabado";
  if (diaSemana === 0) dia = "domingo";

  contenedor.textContent = "Consultando horarios disponibles...";

  try {
    const parametros = new URLSearchParams({
      dia, origen, destino, fecha
    });

    const [res, resPrecio] = await Promise.all([
      fetch("/horarios?" + parametros),
      fetch("/tarifa?" + new URLSearchParams({origen,destino}))
    ]);

    if (!res.ok || !resPrecio.ok) {
      throw new Error("No se pudieron consultar los horarios.");
    }

    const data = await res.json();
    const dataPrecio = await resPrecio.json();

    if (consulta !== consultaHorarios) return;

    const horarios = Array.isArray(data.horarios)
      ? data.horarios
      : [];

    const horariosDisponibles = horarios.filter(hora => {
      if (fecha !== fechaActualChile()) return true;

      const partes = String(hora).match(/^(\d{1,2}):(\d{2})$/);
      if (!partes) return false;

      const ahoraChile = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Santiago",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).format(new Date());

      return String(hora).padStart(5,"0") > ahoraChile;
    });

    contenedor.innerHTML = "";

    const titulo = document.createElement("h3");
    titulo.textContent = "Selecciona un horario:";
    contenedor.appendChild(titulo);

    if (!horariosDisponibles.length) {
      const aviso = document.createElement("p");
      aviso.textContent =
        "No hay horarios disponibles para esta fecha y ruta.";
      contenedor.appendChild(aviso);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "horarios-grid";

    horariosDisponibles.forEach(hora => {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "horario-opcion";
      boton.textContent = hora;

      boton.addEventListener("click", () => {
        grid.querySelectorAll(".horario-opcion")
          .forEach(b => b.classList.remove("activo"));

        boton.classList.add("activo");
        window.horarioSeleccionado = hora;
      });

      grid.appendChild(boton);
    });

    contenedor.appendChild(grid);

    const precio = document.createElement("p");
    precio.textContent = "Precio: $" + dataPrecio.precio;
    contenedor.appendChild(precio);

    window.precioSeleccionado = dataPrecio.precio;

  } catch (error) {
    if (consulta !== consultaHorarios) return;
    console.error("Error consultando horarios:", error);
    contenedor.textContent =
      "No se pudieron cargar los horarios. Intenta nuevamente.";
  }
}

actualizarDestinos();

const campoFecha = document.getElementById("fecha");
campoFecha.value = fechaActualChile();
campoFecha.min = fechaActualChile();

document.getElementById("origen").addEventListener("change", buscar);
document.getElementById("destino").addEventListener("change", buscar);
campoFecha.addEventListener("change", buscar);



buscar();

function irAAsientos() {
    if (!validarConfirmacionCorreo()) return;
    const fecha = document.getElementById("fecha").value;
    const nombre = document.getElementById("nombre").value;
    const correo = document.getElementById("correo").value;

    if (!nombre) {
        alert("Ingresa tu nombre");
        return;
    }

    if (!correo) {
        alert("Ingresa tu correo");
        return;
    }    


    if (!fecha) {
        alert("Selecciona una fecha");
        return;
    }

    if (!window.horarioSeleccionado) {
        alert("Selecciona un horario");
        return;
    }      

    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    window.location.href = "/asientos.html?origen=" + origen +
    "&destino=" + destino +
    "&fecha=" + fecha +
    "&hora=" + window.horarioSeleccionado +
    "&nombre=" + nombre +
    "&correo=" + correo +
    "&precio=" + window.precioSeleccionado;
}


let mesVisible = null;

function fechaISO(anio, mes, dia) {
  return anio + "-" +
    String(mes + 1).padStart(2,"0") + "-" +
    String(dia).padStart(2,"0");
}

function dibujarCalendario() {
  const fecha = document.getElementById("fecha").value ||
    fechaActualChile();

  if (!mesVisible) {
    const partes = fecha.split("-").map(Number);
    mesVisible = new Date(partes[0], partes[1] - 1, 1);
  }

  const anio = mesVisible.getFullYear();
  const mes = mesVisible.getMonth();

  document.getElementById("calendario-mes").textContent =
    new Intl.DateTimeFormat("es-CL", {
      month: "long",
      year: "numeric"
    }).format(mesVisible);

  const contenedor =
    document.getElementById("calendario-fechas");

  contenedor.innerHTML = "";

  const primerDia = (new Date(anio, mes, 1).getDay() + 6) % 7;
  const totalDias = new Date(anio, mes + 1, 0).getDate();

  for (let i = 0; i < primerDia; i++) {
    contenedor.appendChild(document.createElement("span"));
  }

  for (let dia = 1; dia <= totalDias; dia++) {
    const valor = fechaISO(anio, mes, dia);
    const boton = document.createElement("button");

    boton.type = "button";
    boton.textContent = dia;
    boton.disabled = valor < fechaActualChile();

    if (valor === fecha) boton.classList.add("elegida");

    boton.addEventListener("click", () => {
      const campo = document.getElementById("fecha");
      campo.value = valor;

      document.getElementById("calendario-panel").hidden = true;

      campo.dispatchEvent(new Event("change", {bubbles:true}));
    });

    contenedor.appendChild(boton);
  }

  const hoy = fechaActualChile().slice(0,7);
  const visible = fechaISO(anio,mes,1).slice(0,7);

  document.getElementById("mes-anterior").disabled =
    visible <= hoy;
}

const panelCalendario =
  document.getElementById("calendario-panel");

function alternarCalendario() {
  panelCalendario.hidden = !panelCalendario.hidden;

  if (!panelCalendario.hidden) {
    mesVisible = null;
    dibujarCalendario();
  }
}

document.getElementById("abrir-calendario")
  .addEventListener("click", alternarCalendario);

document.getElementById("fecha")
  .addEventListener("click", alternarCalendario);

document.getElementById("mes-anterior")
  .addEventListener("click", () => {
    mesVisible.setMonth(mesVisible.getMonth() - 1);
    dibujarCalendario();
  });

document.getElementById("mes-siguiente")
  .addEventListener("click", () => {
    mesVisible.setMonth(mesVisible.getMonth() + 1);
    dibujarCalendario();
  });

</script>

<script>
(async function completarDatosUsuario() {
  const token = localStorage.getItem("vientosur_token");
  if (!token) return;

  try {
    const respuesta = await fetch("/api/auth/yo", {
      headers: { Authorization: "Bearer " + token }
    });

    if (!respuesta.ok) return;

    const datos = await respuesta.json();
    if (!datos.ok || !datos.usuario) return;

    const nombre = document.getElementById("nombre");
    const correo = document.getElementById("correo");

    if (nombre) nombre.value = datos.usuario.nombre || "";
    if (correo) correo.value = datos.usuario.correo || "";
  } catch (error) {
    console.error("No se pudieron cargar los datos del usuario");
  }
})();
</script>


<script>
let correoCuentaVerificado = false;

function validarConfirmacionCorreo() {
  const correo = document.getElementById("correo").value.trim();
  const confirmacion = document.getElementById("confirmar-correo").value.trim();

  if (correoCuentaVerificado) return true;

  if (!confirmacion || correo.toLowerCase() !== confirmacion.toLowerCase()) {
    alert("Los correos electrónicos no coinciden.");
    return false;
  }

  return true;
}

(async function configurarCorreoCuenta() {
  const token = localStorage.getItem("vientosur_token");
  if (!token) return;

  try {
    const respuesta = await fetch("/api/auth/yo", {
      headers: { Authorization: "Bearer " + token }
    });

    if (!respuesta.ok) return;

    const datos = await respuesta.json();
    if (!datos.ok || !datos.usuario) return;

    const campo = document.getElementById("correo");
    campo.value = datos.usuario.correo || "";
    campo.readOnly = true;

    correoCuentaVerificado = true;
    document.getElementById("bloque-confirmar-correo").hidden = true;
  } catch (error) {
    console.error("No se pudo consultar la cuenta");
  }
})();
</script>

</body>
</html>
