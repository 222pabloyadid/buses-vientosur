<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta | VientoSur</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  background: linear-gradient(150deg,#d9eef6,#eef7fa);
  color: #102d58;
}
.contenedor {
  width: min(100% - 32px, 440px);
  margin: 24px auto;
}
.logo {
  display: block;
  width: 190px;
  max-width: 75%;
  margin: 0 auto 15px;
}
.tarjeta {
  background: white;
  border: 1px solid #d0e4eb;
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 12px 30px #102d5815;
}
h1 { font-size: 25px; margin: 0 0 8px; }
.subtitulo { color: #657c92; font-size: 14px; }
label {
  display: block;
  margin: 17px 0 7px;
  font-size: 13px;
  font-weight: bold;
}
input {
  width: 100%;
  height: 50px;
  padding: 12px;
  border: 1px solid #cad9e5;
  border-radius: 11px;
  font-size: 16px;
}
input:focus {
  outline: 2px solid #08a69b;
  outline-offset: 1px;
}
button {
  width: 100%;
  min-height: 50px;
  margin-top: 23px;
  border: 0;
  border-radius: 11px;
  background: #102d58;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
button:disabled { opacity: .6; }
.enlace {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #087f83;
  font-weight: bold;
  text-decoration: none;
}
.mensaje {
  padding-top: 12px;
  font-size: 14px;
  line-height: 1.5;
}
</style>

</head>
<body>
<main class="contenedor">
<img src="/logo.png" class="logo" alt="Buses VientoSur">
<section class="tarjeta">
<h1>Crear cuenta</h1>
<p class="subtitulo">Regístrate para disfrutar los servicios de VientoSur.</p>
<form id="formulario">

<label for="nombre">Nombre completo</label>
<input id="nombre" name="nombre" autocomplete="name" maxlength="100" required>
<label for="telefono">Teléfono</label>
<input id="telefono" name="telefono" type="tel" autocomplete="tel" required>
<label for="correo">Correo electrónico</label>
<input id="correo" name="correo" type="email" autocomplete="email" required>
<label for="confirmar-correo">Confirmar correo electrónico</label>
<input id="confirmar-correo" type="email" autocomplete="off" required>

<label for="password">Contraseña (mínimo 10 caracteres)</label>
<div class="campo-password" style="position:relative">
<input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required style="padding-right:55px;box-sizing:border-box;width:100%">
<button type="button" id="ver-password" aria-label="Mostrar contraseña" aria-pressed="false" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;padding:8px;font-size:22px;line-height:1">👁️</button>
</div>

<button type="submit" id="boton">Crear mi cuenta</button>
</form>
<div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
<a class="enlace" href="/login.html">Ya tengo una cuenta</a>
<a class="enlace" href="/">Volver al inicio</a>
</section>
</main>
<script>
document.getElementById("formulario").addEventListener("submit", async e => {
  e.preventDefault();
  const boton = document.getElementById("boton");
  const mensaje = document.getElementById("mensaje");
  boton.disabled = true;
  mensaje.textContent = "Procesando...";
  try {
    const formulario = new FormData(e.target);
    const datos = Object.fromEntries(formulario.entries());

    const correo = document.getElementById("correo").value.trim();
    const confirmacion = document.getElementById("confirmar-correo").value.trim();

    if (correo.toLowerCase() !== confirmacion.toLowerCase()) {
      mensaje.textContent = "Los correos electrónicos no coinciden.";
      mensaje.style.color = "#b42318";
      return;
    }

    const respuesta = await fetch("/api/auth/registro", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos)
    });

    const resultado = await respuesta.json();
    mensaje.textContent = resultado.mensaje || "";

    if (!respuesta.ok || !resultado.ok) {
      if (!mensaje.textContent) mensaje.textContent = "No se pudo completar.";
      mensaje.style.color = "#b42318";
      return;
    }

    mensaje.style.color = "#087f83";

    if ("/api/auth/registro" === "/api/auth/login" && resultado.token) {
      sessionStorage.setItem("vientosur_token", resultado.token);
      window.location.replace("/cuenta.html");
    }
  } catch (error) {
    mensaje.textContent = "No se pudo conectar con el servidor.";
    mensaje.style.color = "#b42318";
  } finally {
    boton.disabled = false;
  }
});
</script>

<script>
document.getElementById("ver-password").addEventListener("click", function() {
  const campo = document.getElementById("password");
  const visible = campo.type === "password";
  campo.type = visible ? "text" : "password";
  this.textContent = visible ? "🙈" : "👁️";
  this.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
  this.setAttribute("aria-pressed", String(visible));
});
</script>
</body>
</html>
